name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - name: Consumer package validation
        run: npm run validate:consumer
        if: matrix.node-version == '22.x'

  angular-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: ['16', '17', '18', '19', '20']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Typecheck against Angular ${{ matrix.angular }}
        run: node scripts/validate-angular-matrix.mjs --angular=${{ matrix.angular }}

  peer-range:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert Angular peer range (16+ for Signals / Ionic)
        run: |
          node -e "
          const pkg = require('./projects/ngxsmk-socket-io/package.json');
          const peers = pkg.peerDependencies || {};
          for (const name of ['@angular/core', '@angular/common']) {
            const range = peers[name];
            if (!range || !String(range).includes('>=16')) {
              console.error('Expected', name, 'peer to allow >=16, got', range);
              process.exit(1);
            }
            console.log('✓', name, range);
          }
          const keywords = pkg.keywords || [];
          for (const key of ['ionic', 'capacitor', 'angular16']) {
            if (!keywords.includes(key)) {
              console.error('Missing keyword:', key);
              process.exit(1);
            }
          }
          console.log('✓ ionic/capacitor keywords present');
          "
